<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasta Menu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pasta.css') }}">
</head>
<body>
  <header>
    <h1>🍝 Pasta Menu</h1>
  </header>

  <section class="menu-options">
    <div class="card">
      <h2>Veg Pastas</h2>
      <p>Delightful pastas with creamy and spicy vegetarian flavors.</p>
      <a href="{{ url_for('pasta_veg') }}" class="btn">View Veg Pastas</a>
    </div>

    <div class="card">
      <h2>Non-Veg Pastas</h2>
      <p>Loaded with chicken, seafood, and rich sauces.</p>
      <a href="{{ url_for('pasta_nonveg') }}" class="btn">View Non-Veg Pastas</a>
    </div>

    <div class="card">
      <h2>Pasta Combos</h2>
      <p>Pasta with garlic bread, pizza, and more.</p>
      <a href="{{ url_for('pasta_combo') }}" class="btn">View Pasta Combos</a>
    </div>
  </section>

  <footer>
    <a href="{{ url_for('home') }}" class="btn back">⬅ Back to Home</a>
  </footer>
</body>
</html>
