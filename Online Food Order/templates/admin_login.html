<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 Admin Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #007bff, #6610f2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 🔥 CARD SIZE INCREASED */
    form {
      background: white;
      padding: 45px;
      border-radius: 18px;
      box-shadow: 0px 10px 35px rgba(0,0,0,0.3);
      width: 420px;
      text-align: center;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 24px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
      transform: scale(1.03);
    }

    .error {
      color: red;
      margin-bottom: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <form method="POST" action="/admin-login">
    <h2>🔐 Admin Login</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <input
      type="password"
      name="password"
      placeholder="Enter Admin Password"
      required
      autofocus
    />

    <button type="submit">Login</button>
  </form>

</body>
</html>
