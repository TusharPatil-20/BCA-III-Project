<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Menu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pizza.css') }}">
</head>
<body>
  <header>
    <h1>🍕 Pizza Menu</h1>
  </header>

  <section class="menu-options">
    <div class="card">
      <h2>Veg Pizzas</h2>
      <p>Delicious vegetarian pizzas loaded with fresh toppings.</p>
      <a href="{{ url_for('pizza_veg') }}" class="btn">View Veg Pizzas</a>
    </div>

    <div class="card">
      <h2>Non-Veg Pizzas</h2>
      <p>Loaded with chicken, pepperoni, and more meaty toppings.</p>
      <a href="{{ url_for('pizza_nonveg') }}" class="btn">View Non-Veg Pizzas</a>
    </div>

    <div class="card">
      <h2>Pizza Combos</h2>
      <p>Perfect combos of pizza with sides and drinks.</p>
      <a href="{{ url_for('pizza_combo') }}" class="btn">View Pizza Combos</a>
    </div>
  </section>

  <footer>
   <a href="{{ url_for('home') }}" class="btn back">⬅ Back to Home</a>
  </footer>
</body>
</html>
